<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToDo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="w-[750px] mx-auto bg-white text-black dark:bg-gray-950 dark:text-white transition-colors duration-200"
  >
    <h1
      class="uppercase text-center font-[Kanit] font-medium text-[26px] leading-0 tracking-normal mt-[60px] mb-[38px]"
    >
      todo list
    </h1>

    <div class="w-full flex gap-[16px] justify-between">
      <div class="relative w-full">
        <input
          type="search"
          placeholder="Search note..."
          class="border-1 rounded-[5px] w-full border-purple-700 text-purple-400 pl-[16px] pr-[40px] py-[8px] h-full dark:border-white dark:text-white"
          id="searchInput"
        />
        <div class="absolute inset-y-0 right-0 flex items-center pr-[16px]">
          <i
            data-lucide="search"
            width="25px"
            height="25px"
            stroke-width="2"
            class="text-purple-700 dark:text-white"
          ></i>
        </div>
      </div>

      <div class="relative w-48">
        <select
          name="select"
          id="select"
          class="w-full appearance-none bg-purple-700 hover:bg-purple-800 text-white font-[Kanit] text-[16px] font-medium leading-none tracking-normal pl-4 pr-10 py-3 rounded-lg border border-purple-600/30 shadow-md transition-all duration-200 ease-in-out cursor-pointer"
        >
          <option value="all" class="bg-purple-900 text-white">ALL</option>
          <option value="completed" class="bg-purple-900 text-white">
            Complete
          </option>
          <option value="active" class="bg-purple-900 text-white">
            Incomplete
          </option>
        </select>
        <!-- custom arrow -->
        <div
          class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-white/80"
        >
          <svg
            class="fill-current h-4 w-4"
            xmlns="http://w3.org"
            viewBox="0 0 20 20"
          >
            <path
              d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"
            />
          </svg>
        </div>
      </div>

      <button
        class="bg-purple-700 p-[10px] rounded-[5px] hover:bg-purple-900 transition-colors duration-300 hover:cursor-pointer"
        id="theme-toggle"
      >
        <img src="./icons/sun.svg" alt="light" />
      </button>

      <button
        class="fixed bottom-[40px] right-[calc(50vw-372px)] w-[50px] h-[50px] rounded-full bg-purple-700 shadow-[0_0_4px_0_#6c63ff] flex justify-center items-center text-white font-medium hover:cursor-pointer transition-colors duration-300 hover:bg-purple-900"
        id="openPopupButton"
      >
        <i data-lucide="plus" stroke-width="3" width="35px" height="35px"></i>
      </button>

      <button
        class="hidden fixed bottom-[40px] left-[calc(50vw-372px)] w-[150px] h-[40px] rounded-md border-2 border-purple-300 bg-purple-700 shadow-[0_0_4px_0_#6c63ff] flex justify-center items-center hover:cursor-pointer hover:bg-purple-500 font-[Raleway] font-medium gap-[5px] transition-all duration-300"
        id="undo"
      >
        <span id="undo-text">UNDO (5s)</span> <i data-lucide="rotate-ccw"></i>
      </button>
    </div>

    <div
      class="mx-[115px] mt-[30px] w-[520px] flex flex-col gap-[17px]"
      id="tasks"
    ></div>

    <dialog
      class="mx-auto mt-[160px] rounded-[16px] w-[400px] px-[18px] py-[30px] bg-white dark:bg-gray-950 border-2 border-white backdrop:blur-md backdrop:bg-black/30"
      id="popupDialog"
    >
      <form action="">
        <h3
          class="text-center uppercase font-[Kanit] text-black dark:text-white font-medium tracking-normal leading-[100%] text-[24px]"
        >
          new note
        </h3>
        <input
          type="text"
          id="taskInput"
          placeholder="New note..."
          class="border rounded-[5px] w-full border-purple-700 text-purple-400 dark:border-white dark:text-white mt-[25px] py-[11px] px-[16px]"
        />
        <div class="flex justify-between mt-[200px] px-[20px]">
          <button
            class="uppercase border border-purple-700 font-[Kanit] font-medium text-[18px] leading-[100%] tracking-normal rounded-[5px] text-purple-500 px-[22px] py-[10px] hover:bg-purple-400 transition-colors duration-200 hover:text-white"
            type="button"
            onclick="popupDialog.close()"
          >
            Cancel
          </button>
          <button
            class="uppercase border border-purple-700 font-[Kanit] font-medium text-[18px] leading-[100%] tracking-normal rounded-[5px] text-white px-[22px] py-[10px] bg-purple-600 hover:bg-purple-900 transition-colors duration-200 hover:text-white"
            type="button"
            id="applyButton"
            onclick="addNewTask()"
          >
            Apply
          </button>
        </div>
      </form>
    </dialog>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      const searchInput = document.getElementById("searchInput");
      let searchQuery = "";

      const filterSelect = document.getElementById("select");
      let filterStatus = "all";

      const toggleButton = document.getElementById("theme-toggle");
      const rootEl = document.documentElement;

      const openPopupButton = document.getElementById("openPopupButton");
      const popupDialog = document.getElementById("popupDialog");

      const taskInput = document.getElementById("taskInput");
      const applyButton = document.getElementById("applyButton");

      const tasksString = localStorage.getItem("tasks");

      let tasksArray = tasksString ? JSON.parse(tasksString) : [];

      searchInput.addEventListener("input", (event) => {
        searchQuery = event.target.value.toLowerCase().trim();
        render();
      });

      filterSelect.addEventListener("change", (event) => {
        filterStatus = event.target.value;
        render();
      });

      openPopupButton.addEventListener("click", () => {
        popupDialog.showModal();
      });

      if (
        localStorage.getItem("theme") === "dark" ||
        (!localStorage.getItem("theme") &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        rootEl.classList.add("dark");
      }

      toggleButton.addEventListener("click", () => {
        rootEl.classList.toggle("dark");
        if (rootEl.classList.contains("dark")) {
          localStorage.setItem("theme", "dark");
          toggleButton.innerHTML = `<img src="./icons/sun.svg" alt="light" />`;
        } else {
          localStorage.setItem("theme", "light");
          toggleButton.innerHTML = `<img src="./icons/moon.svg" alt="dark" />`;
        }
      });

      const addNewTask = () => {
        if (taskInput.value === "") {
          popupDialog.close();
          return;
        }

        const newTask = {
          name: taskInput.value.trim(),
          status: "active",
        };

        tasksArray.unshift(newTask);

        render();

        taskInput.value = "";
        popupDialog.close();
      };

      taskInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addNewTask();
        }
      });

      let lastDeletedTask = null;
      let lastDeletedIndex = null;
      let countdown = null;

      const triggerUndo = (removedTask, index) => {
        lastDeletedTask = removedTask;
        lastDeletedIndex = index;
        let timeLeft = 5;

        const undo = document.getElementById("undo");
        const undoText = document.getElementById("undo-text");

        undo.classList.remove("hidden", "opacity-0", "pointer-events-none");
        undo.classList.add("opacity-100");
        undoText.textContent = `UNDO (${timeLeft}s)`;

        if (countdown) clearInterval(countdown);

        countdown = setInterval(() => {
          timeLeft--;
          if (timeLeft > 0) {
            undoText.textContent = `UNDO (${timeLeft}s)`;
          } else {
            clearInterval(countdown);
            undo.classList.add("opacity-0", "pointer-events-none");
            setTimeout(() => {
              undo.classList.add("hidden");
            }, 300);
          }
        }, 1000);

        undo.onclick = () => {
          clearInterval(countdown);
          undo.classList.add("hidden");
          if (lastDeletedIndex != null && lastDeletedTask != null) {
            tasksArray.splice(lastDeletedIndex, 0, lastDeletedTask);
            render();
            lastDeletedTask = null;
            lastDeletedIndex = null;
          }
        };
      };

      const deleteTask = (index) => {
        if (confirm("Are you sure?")) {
          const removedTask = tasksArray.splice(index, 1)[0];
          render();
          triggerUndo(removedTask, index);
        }
      };

      const toggleTaskStatus = (index) => {
        tasksArray[index].status =
          tasksArray[index].status === "completed" ? "active" : "completed";
        render();
      };

      const cancelEdit = (index) => {
        document
          .getElementById(`taskName${index}`)
          .classList.replace("hidden", "flex");
        document
          .getElementById(`taskEdit${index}`)
          .classList.replace("flex", "hidden");
      };

      const saveTask = (index) => {
        const editInput = document.getElementById(`taskInput${index}`);
        const newVal = editInput.value.trim();

        if (newVal) {
          tasksArray[index].name = newVal;
          render();
        }
      };

      function editTask(index) {
        document
          .getElementById(`taskName${index}`)
          .classList.replace("flex", "hidden");
        document
          .getElementById(`taskEdit${index}`)
          .classList.replace("hidden", "flex");

        document.getElementById(`taskInput${index}`).value =
          tasksArray[index].name;
        document.getElementById(`taskInput${index}`).focus();
      }

      const render = () => {
        localStorage.setItem("tasks", JSON.stringify(tasksArray));

        const tasksContainer = document.getElementById("tasks");

        const filteredTasks = tasksArray.filter((task) => {
          const matchesSearch = task.name.toLowerCase().includes(searchQuery);
          const matchesStatus =
            filterStatus === "all" || task.status === filterStatus;

          return matchesSearch && matchesStatus;
        });

        if (!filteredTasks || filteredTasks.length === 0) {
          tasksContainer.innerHTML = `<div class="flex items-center mt-[20px] flex-col">
                                        <img src="./icons/empty.png" alt="empty" />
                                        <p class="font=[Kanit] font-normal text-center text-black dark:text-white mt-[20px] text[20px]">Empty...</p>
                                      </div>`;
          lucide.createIcons();
          return;
        }

        const tasksHTML = filteredTasks
          .map((task) => {
            const originalIndex = tasksArray.indexOf(task);
            return `<div class="group flex w-full gap-[10px] hover: cursor-pointer">
                  <input
                    type="checkbox"
                    class="w-[26px] h-[26px] border-purple-700 accent-purple-700"
                    ${task.status === "completed" ? "checked" : ""}
                    onchange ="toggleTaskStatus(${originalIndex})"
                  />

                  <div id="taskName${originalIndex}" class="flex">
                    <p
                      class="w-[420px] font-[Kanit] font-medium tracking-normal leading-[100%] text-[20px] ${task.status === "completed" ? "line-through text-gray-500" : ""}"
                    >
                      ${task.name}
                    </p>
                    <div class="hidden gap-[10px] group-hover:flex">
                      <button class="bg-[url('./icons/edit-pen.svg')] h-6 w-6 bg-no-repeat bg-center hover:cursor-pointer hover:bg-[url('./icons/edit-hover.png')]" onclick="editTask(${originalIndex})"></button>
                      <button class="bg-[url('./icons/delete-bin.svg')] h-6 w-6 bg-no-repeat bg-center hover:cursor-pointer hover:bg-[url('./icons/delete-bin-hover.png')]" onclick="deleteTask(${originalIndex})"></button>
                    </div>
                  </div>

                  <div id="taskEdit${originalIndex}" class="hidden w-full">
                    <input type="text" id="taskInput${originalIndex}" class="w-full font-[Kanit] font-medium tracking-normal leading-[100%] text-[20px]"/>
                    <div class="hidden gap-[10px] group-hover:flex">
                      <button class="h-6 w-6 hover:cursor-pointer" onclick="saveTask(${originalIndex})">✅</button>
                      <button class="h-6 w-6 hover:cursor-pointer " onclick="cancelEdit(${originalIndex})">❌</button>
                    </div>
                  </div>
                </div>
                `;
          })
          .join(`<div class="w-full bg-purple-500 h-[1px] w-full"></div>`);

        tasksContainer.innerHTML = tasksHTML;
        lucide.createIcons();
      };

      render();
    </script>
  </body>
</html>
